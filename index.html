<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Programa de Estágio Agibank</title>
  <meta name="description" content="Programa de Estágio Agibank - Faça parte do time que está reinventando o mercado financeiro.">

  <link rel="icon" type="image/png" href="assets/img/favicon.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- ===================================
       HEADER / NAV
  =================================== -->
  <header id="header" class="header">
    <nav class="nav container">
      <a href="#header" class="nav__logo" aria-label="Voltar ao topo">
        <img src="assets/img/logo-agibank.svg" alt="Agibank" width="90" height="32">
      </a>

      <ul class="nav__menu" id="navMenu">
        <li><a href="#why-apply" class="nav__link">O Programa</a></li>
        <li><a href="#requirements" class="nav__link">Requisitos</a></li>
        <li><a href="#effectiveness" class="nav__link">Benefícios</a></li>
        <li><a href="#program-steps" class="nav__link">Processo seletivo</a></li>
      </ul>

      <a href="#" class="nav__cta">Fazer inscrição</a>

      <button class="nav__toggle" id="navToggle" aria-label="Abrir menu" aria-expanded="false">
        <span></span>
        <span></span>
        <span></span>
      </button>
    </nav>
  </header>

  <!-- ===================================
       HERO BANNER
  =================================== -->
  <section id="hero-banner" class="hero-banner">

    <!-- Background full-bleed (independente da prancheta) -->
    <div class="hero-banner__bg">
      <img src="assets/img/Programa-Estagio-Hero-BG.jpg" alt="" class="hero-banner__bg-img">
    </div>

    <!-- Prancheta única (mesma referência para TODOS os elementos) -->
    <div class="hero-banner__stage" id="heroStage">

      <img src="assets/img/Caco-02-Hero.png" alt="" class="hero-banner__caco caco--02" data-parallax="repel" data-editable="caco-02" data-strength="35">
      <img src="assets/img/Caco-01-Hero.png" alt="" class="hero-banner__caco caco--01" data-parallax="repel" data-editable="caco-01" data-strength="25">
      <img src="assets/img/Caco-03-Hero.png" alt="" class="hero-banner__caco caco--03" data-parallax="repel" data-editable="caco-03" data-strength="30">
      <img src="assets/img/Caco-04-Hero.png" alt="" class="hero-banner__caco caco--04" data-parallax="repel" data-editable="caco-04" data-strength="25">

      <div class="hero-banner__logo-wrap hero-anim hero-anim--fade" data-editable="logo-programa">
        <img src="assets/img/Logo-Programa-Estagio-Agibank-2027.svg" alt="Programa de Estágio do Agibank - 1ª turma de 2027" class="hero-banner__program-logo">
      </div>

      <div class="hero-banner__people hero-anim hero-anim--rise" data-editable="pessoas">
        <div class="hero-banner__people-parallax" data-parallax="tilt-x" data-strength="18">
          <img src="assets/img/Pessoas-Hero.png" alt="Estagiários do Agibank" class="hero-banner__people-img">
        </div>
      </div>

      <div class="hero-banner__text-wrap hero-anim hero-anim--fade" data-editable="texto-cta">
        <h1 class="hero-banner__title">
          <span class="is-white">Seu</span> <span class="is-green">crescimento</span><br>
          <span class="is-white">em</span> <span class="is-green">primeiro lugar.</span>
        </h1>
        <a href="#" class="hero-banner__cta">Fazer inscrição!</a>
      </div>

    </div>
  </section>

  <section id="why-apply"></section>
  <section id="cta-intro"></section>
  <section id="awards"></section>
  <section id="cta-purpose"></section>
  <section id="kickstart"></section>
  <section id="requirements"></section>
  <section id="areas"></section>
  <section id="program-steps"></section>
  <section id="effectiveness"></section>
  <section id="media"></section>
  <section id="campus-gallery"></section>

  <footer id="footer"></footer>

  <script src="js/script.js"></script>
</body>
</html>
