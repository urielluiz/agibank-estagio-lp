<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Programa de Estágio Agibank</title>
  <meta name="description" content="Programa de Estágio Agibank - Faça parte do time que está reinventando o mercado financeiro.">

  <!-- Favicon (ajustar path quando tivermos o arquivo) -->
  <link rel="icon" type="image/png" href="assets/img/favicon.png">

  <!-- CSS -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- ===================================
       HEADER / NAV
       (fica sticky no scroll)
  =================================== -->
  <header id="header" class="header">
    <nav class="nav container">

      <!-- Logo -->
      <a href="#header" class="nav__logo" aria-label="Voltar ao topo">
        <img src="assets/img/logo-agibank.svg" alt="Agibank" width="90" height="32">
      </a>

      <!-- Menu Desktop -->
      <ul class="nav__menu" id="navMenu">
        <li><a href="#why-apply" class="nav__link">O Programa</a></li>
        <li><a href="#requirements" class="nav__link">Requisitos</a></li>
        <li><a href="#effectiveness" class="nav__link">Benefícios</a></li>
        <li><a href="#program-steps" class="nav__link">Processo seletivo</a></li>
      </ul>

      <!-- CTA -->
      <a href="#" class="nav__cta">Fazer inscrição</a>

      <!-- Botão hambúrguer (mobile) -->
      <button class="nav__toggle" id="navToggle" aria-label="Abrir menu" aria-expanded="false">
        <span></span>
        <span></span>
        <span></span>
      </button>

    </nav>
  </header>

  <!-- ===================================
       HERO BANNER
       (Header/Banner principal - conteúdo)
  =================================== -->
  <section id="hero-banner" class="hero-banner">

    <!-- Background -->
    <div class="hero-banner__bg">
      <img src="assets/img/Programa-Estagio-Hero-BG.jpg" alt="" class="hero-banner__bg-img">
    </div>

    <!-- Cacos decorativos -->
    <img src="assets/img/Caco-02-Hero.png" alt="" class="hero-banner__caco caco--02" data-parallax data-strength="35">
    <img src="assets/img/Caco-01-Hero.png" alt="" class="hero-banner__caco caco--01" data-parallax data-strength="25">
    <img src="assets/img/Caco-03-Hero.png" alt="" class="hero-banner__caco caco--03" data-parallax data-strength="30">
    <img src="assets/img/Caco-04-Hero.png" alt="" class="hero-banner__caco caco--04" data-parallax data-strength="25">

    <div class="hero-banner__content container">

      <!-- Logo do programa -->
      <div class="hero-banner__logo-wrap hero-anim hero-anim--fade">
        <img src="assets/img/Logo-Programa-Estagio-Agibank-2027.svg" alt="Programa de Estágio do Agibank - 1ª turma de 2027" class="hero-banner__program-logo">
      </div>

      <!-- Pessoas -->
      <div class="hero-banner__people hero-anim hero-anim--rise">
        <img src="assets/img/Pessoas-Hero.png" alt="Estagiários do Agibank" class="hero-banner__people-img">
      </div>

      <!-- Texto + CTA -->
      <div class="hero-banner__text-wrap hero-anim hero-anim--fade">
        <h1 class="hero-banner__title">
          <span class="is-white">Seu</span> <span class="is-green">crescimento</span><br>
          <span class="is-white">em</span> <span class="is-green">primeiro lugar.</span>
        </h1>
        <a href="#" class="hero-banner__cta">Fazer inscrição!</a>
      </div>

    </div>
  </section>

  <!-- ===================================
       SEÇÃO 01 - WHY APPLY
       (Primeira dobra – Por que se inscrever)
  =================================== -->
  <section id="why-apply">
  </section>

  <!-- ===================================
       SEÇÃO 02 - CTA INTRO
       (Segunda dobra – CTA)
  =================================== -->
  <section id="cta-intro">
  </section>

  <!-- ===================================
       SEÇÃO 03 - AWARDS
       (Terceira dobra – Reconhecimentos Agi)
  =================================== -->
  <section id="awards">
  </section>

  <!-- ===================================
       SEÇÃO 04 - CTA PURPOSE
       (Quarta dobra – CTA com o propósito)
  =================================== -->
  <section id="cta-purpose">
  </section>

  <!-- ===================================
       SEÇÃO 05 - KICKSTART
       (Quinta dobra – Pra começar com tudo)
  =================================== -->
  <section id="kickstart">
  </section>

  <!-- ===================================
       SEÇÃO 06 - REQUIREMENTS
       (Sexta dobra – Pré-requisitos)
  =================================== -->
  <section id="requirements">
  </section>

  <!-- ===================================
       SEÇÃO 07 - AREAS
       (Sétima dobra – Áreas)
  =================================== -->
  <section id="areas">
  </section>

  <!-- ===================================
       SEÇÃO 08 - PROGRAM STEPS
       (Oitava dobra – Etapas do programa)
  =================================== -->
  <section id="program-steps">
  </section>

  <!-- ===================================
       SEÇÃO 09 - EFFECTIVENESS
       (Nona dobra – Efetivações e proposta de valor)
  =================================== -->
  <section id="effectiveness">
  </section>

  <!-- ===================================
       SEÇÃO 10 - MEDIA
       (Décima dobra – Agibank na mídia)
  =================================== -->
  <section id="media">
  </section>

  <!-- ===================================
       SEÇÃO 11 - CAMPUS GALLERY
       (Décima primeira dobra – Fotos campus)
  =================================== -->
  <section id="campus-gallery">
  </section>

  <!-- ===================================
       FOOTER
  =================================== -->
  <footer id="footer">
  </footer>

  <!-- JS -->
  <script src="js/script.js"></script>
</body>
</html>
